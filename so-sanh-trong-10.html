<html lang="vi">
<head>

<style>
  :root{ --radius:0.625rem; --background:oklch(1 0 0); --foreground:oklch(0.145 0 0); --card:oklch(1 0 0); --card-foreground:oklch(0.145 0 0); --primary:oklch(0.205 0 0); --primary-foreground:oklch(0.985 0 0); --secondary:oklch(0.97 0 0); --secondary-foreground:oklch(0.205 0 0); --muted:oklch(0.97 0 0); --muted-foreground:oklch(0.556 0 0); --accent:oklch(0.97 0 0); --accent-foreground:oklch(0.205 0 0); --destructive:oklch(0.577 0.245 27.325); --border:oklch(0.922 0 0); --input:oklch(0.922 0 0); --ring:oklch(0.708 0 0); --success:#16A34A; --success-fg:#15803D; --success-bg:rgba(34,197,94,.12); --radius-md:calc(var(--radius) - 2px); --shadow-xs:0 1px 2px 0 rgb(0 0 0 / 0.05); --shadow-sm:0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1); }
  @media (prefers-color-scheme: dark){ :root{ --background:oklch(0.145 0 0); --foreground:oklch(0.985 0 0); --card:oklch(0.205 0 0); --card-foreground:oklch(0.985 0 0); --primary:oklch(0.985 0 0); --primary-foreground:oklch(0.205 0 0); --secondary:oklch(0.269 0 0); --secondary-foreground:oklch(0.985 0 0); --muted:oklch(0.269 0 0); --muted-foreground:oklch(0.708 0 0); --accent:oklch(0.269 0 0); --accent-foreground:oklch(0.985 0 0); --destructive:oklch(0.704 0.191 22.216); --border:oklch(1 0 0 / 10%); --input:oklch(1 0 0 / 15%); --ring:oklch(0.556 0 0); --success:#4ADE80; --success-fg:#4ADE80; --success-bg:rgba(74,222,128,.15); } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--background); color: var(--foreground); font-family: Geist, 'Be Vietnam Pro', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .page { min-height: 100vh; padding: 0 24px 96px; }
  .wrap { max-width: 1120px; margin: 0 auto; }
  .col16 { display: flex; flex-direction: column; gap: 16px; }

  .eyebrow { font-size: 13px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-foreground); }
  h1.title { margin: 0; font-size: 44px; line-height: 1.1; font-weight: 600; letter-spacing: -0.03em; }
  .intro { margin: 0; max-width: 640px; font-size: 17px; line-height: 1.65; color: var(--muted-foreground); text-wrap: pretty; }
  .intro strong { font-weight: 600; color: var(--foreground); }

  .tabbar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin: 0 auto 36px; }
  .tabs { display: flex; gap: 4px; padding: 4px; background: var(--muted); border-radius: 10px; width: fit-content; }
  .tab { padding: 9px 18px; border: none; border-radius: 8px; white-space: nowrap; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer; transition: all 150ms cubic-bezier(.4,0,.2,1); background: transparent; color: var(--muted-foreground); }
  .tab.on { font-weight: 600; background: var(--card); color: var(--foreground); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .tabhint { font-size: 14px; color: var(--muted-foreground); }

  .section:not(.on) { display: none !important; }

  .signs-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(300px,1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .card-head { display: flex; align-items: center; gap: 12px; }

  .card-head h3 { margin: 0; font-size: 18px; font-weight: 600; }
  .card-head .sub { font-size: 14px; color: var(--muted-foreground); }
  .compare { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; background: var(--muted); border-radius: 10px; padding: 16px; }
  .dots { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .dot { width: 20px; height: 20px; border-radius: 999px; display: block; }
  .mid { font-size: 26px; font-weight: 700; color: var(--foreground); text-align: center; }
  .card p { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted-foreground); }
  .tip { background: var(--muted); border: 1px solid var(--border); border-radius: 12px; padding: 22px 24px; display: flex; flex-direction: column; gap: 10px; }
  .tip h3 { margin: 0; font-size: 17px; font-weight: 600; }
  .tip p { margin: 0; font-size: 15px; line-height: 1.65; color: var(--muted-foreground); }
  .tip strong { font-weight: 600; color: var(--foreground); }

  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
  .panel.pad { padding: 22px 24px; display: flex; flex-direction: column; gap: 18px; }
  .panel h2 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
  .panel .muted { font-size: 14px; color: var(--muted-foreground); }

  .numrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .numbtn { min-width: 56px; padding: 12px 0; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--foreground); font-family: inherit; font-size: 19px; font-weight: 500; cursor: pointer; transition: all 150ms cubic-bezier(.4,0,.2,1); }
  .numbtn.on { border-color: var(--foreground); background: var(--muted); color: var(--foreground); font-weight: 700; }
  .linebox { background: var(--muted); border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .lineexpr { font-size: 46px; font-weight: 700; letter-spacing: .06em; line-height: 1.1; }
  .linenote { font-size: 15px; line-height: 1.6; color: var(--muted-foreground); text-align: center; }
  .panel > p { margin: 0; font-size: 15px; line-height: 1.65; color: var(--muted-foreground); }
  .panel strong { font-weight: 600; color: var(--foreground); }

  .play { max-width: 760px; margin: 0 auto; overflow: hidden; }
  .phead { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 24px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .phead h2 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
  .phead .sub { font-size: 13px; color: var(--muted-foreground); }
  .score { font-size: 14px; font-weight: 600; }
  .pbody { padding: 24px; display: flex; flex-direction: column; gap: 20px; }
  .parena { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: center; background: var(--muted); border-radius: 10px; padding: 24px 20px; }
  .pside { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .pdots { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; max-width: 150px; }
  .pdot { width: 22px; height: 22px; border-radius: 999px; background: var(--foreground); display: block; }
  .pnum { font-size: 30px; font-weight: 700; line-height: 1; }
  .psign { font-size: 36px; font-weight: 700; color: var(--muted-foreground); line-height: 1; text-align: center; }
  .signgrid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
  .signbtn { padding: 16px 0; border: 1px solid var(--border); border-radius: 10px; background: var(--card); color: var(--foreground); font-family: inherit; font-size: 26px; font-weight: 700; cursor: pointer; transition: all 150ms cubic-bezier(.4,0,.2,1); }
  .pfoot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .pfeedback { font-size: 15px; line-height: 1.6; color: var(--muted-foreground); }

  .btn { font-family: inherit; cursor: pointer; border-radius: 8px; font-weight: 600; transition: all 150ms; }
  .btn-secondary { padding: 0 16px; height: 32px; font-size: 14px; border: 1px solid var(--border); background: var(--card); color: var(--foreground); }
  .btn-secondary:hover { background: var(--muted); }
  .btn-ghost { padding: 0 12px; height: 32px; font-size: 14px; border: none; background: transparent; color: var(--muted-foreground); }
  .btn-ghost:hover { background: var(--muted); }

  .levels { display: flex; gap: 4px; padding: 4px; background: var(--muted); border-radius: 10px; }
  .lvbtn { padding: 7px 14px; border: none; border-radius: 8px; white-space: nowrap; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 150ms cubic-bezier(.4,0,.2,1); background: transparent; color: var(--muted-foreground); }
  .lvbtn.on { font-weight: 600; background: var(--card); color: var(--foreground); box-shadow: 0 1px 3px rgba(0,0,0,.1); }

  .quiz { overflow: hidden; }
  .qbody { padding: 8px 24px 24px; display: grid; grid-template-columns: repeat(auto-fill,minmax(320px,1fr)); gap: 4px 28px; }
  .q { padding: 18px 0; border-bottom: 1px solid var(--muted); display: flex; flex-direction: column; gap: 12px; }
  .qtext { display: flex; align-items: center; gap: 12px; line-height: 1.5; }
  .qnum { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 999px; background: var(--muted); color: var(--muted-foreground); font-size: 13px; font-weight: 600; }
  .qlabel { font-size: 18px; font-weight: 600; letter-spacing: .01em; }
  .qopts { display: grid; grid-template-columns: repeat(auto-fit,minmax(120px,1fr)); gap: 8px; }
  .opt { text-align: center; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--foreground); font-family: inherit; font-size: 16px; font-weight: 500; cursor: pointer; transition: all 150ms cubic-bezier(.4,0,.2,1); }
  .qexplain { font-size: 14px; line-height: 1.6; color: var(--muted-foreground); background: var(--muted); border-radius: 8px; padding: 12px 14px; }
  .closing { margin: 20px 0 0; grid-column: 1/-1; font-size: 14px; color: var(--muted-foreground); }

  @media (max-width: 640px) { h1.title { font-size: 34px; } }
</style>

<div class="page">
  <div class="wrap col16" style="padding:64px 0 36px">
    <span class="eyebrow">Mẫu giáo</span>
    <h1 class="title">So sánh các số trong phạm vi 10</h1>
    <p class="intro">Đếm số vật ở hai bên, bên nào nhiều hơn thì số đó lớn hơn. Học ba dấu <strong>&gt;</strong>, <strong>&lt;</strong>, <strong>=</strong> rồi tự luyện tập.</p>
  </div>

  <div class="tabbar wrap">
    <div class="tabs">
      <button type="button" class="tab" data-tab="signs">Ba dấu</button>
      <button type="button" class="tab" data-tab="line">Tia số</button>
      <button type="button" class="tab" data-tab="play">Luyện tập</button>
      <button type="button" class="tab" data-tab="quiz">Bài tập</button>
    </div>
    <span class="tabhint" id="tabhint"></span>
  </div>

  <div class="section wrap col16" id="sec-signs"></div>
  <div class="section wrap col16" id="sec-line"></div>
  <div class="section play panel" id="sec-play"></div>
  <div class="section wrap quiz panel" id="sec-quiz"></div>
</div>

<script>
  const accent = 'var(--foreground)';
  const maxDots = 10;

  const SG = ['>', '<', '='];
  const sgOf = (a, b) => a > b ? '>' : (a < b ? '<' : '=');
  const sgWord = s => s === '>' ? 'lớn hơn' : (s === '<' ? 'bé hơn' : 'bằng');

  function fillSign(a, b) {
    const s = sgOf(a, b);
    return {
      text: 'Điền dấu thích hợp:  ' + a + '  …  ' + b, options: SG, answer: SG.indexOf(s),
      explain: a + ' ' + sgWord(s) + ' ' + b + ' nên viết ' + a + ' ' + s + ' ' + b + '.'
    };
  }

  const PAIRS = [
    [8,5],[2,9],[6,6],[10,7],[3,3],[0,4],[9,1],[5,10],[7,7],[4,8],
    [10,0],[6,2],[1,1],[3,9],[8,8],[5,3],[2,7],[9,10],[0,0],[7,4],
    [4,4],[10,10],[1,6],[8,3],[2,2],[6,9],[5,5],[3,0],[9,9],[7,10]
  ];

  const WORD = [
    { text: 'Số nào lớn nhất trong các số: 3, 7, 5, 10?', options: ['3','5','7','10'], answer: 3,
      explain: '10 đứng xa nhất về bên phải trên tia số nên 10 lớn nhất.' },
    { text: 'Số nào bé nhất trong các số: 4, 0, 8, 2?', options: ['0','2','4','8'], answer: 0,
      explain: '0 là số bé nhất trong phạm vi 10.' },
    { text: 'Số liền sau của 6 là số nào?', options: ['5','7','8','10'], answer: 1,
      explain: 'Trên tia số, ngay bên phải số 6 là số 7. Số liền sau lớn hơn 1 đơn vị.' },
    { text: 'Số liền trước của 9 là số nào?', options: ['7','8','10','6'], answer: 1,
      explain: 'Ngay bên trái số 9 là số 8, nên số liền trước của 9 là 8.' },
    { text: 'Số nào bé hơn 4 nhưng lớn hơn 2?', options: ['1','3','4','5'], answer: 1,
      explain: '3 đứng giữa 2 và 4: 2 < 3 < 4.' },
    { text: 'Bạn An có 7 viên bi, bạn Bình có 9 viên bi. Ai có nhiều bi hơn?', options: ['Bạn An','Bạn Bình','Bằng nhau'], answer: 1,
      explain: '9 > 7 nên bạn Bình có nhiều bi hơn.' },
    { text: 'Trên cây có 5 con chim, dưới sân có 5 con chim. So sánh hai bên?', options: ['Trên cây nhiều hơn','Dưới sân nhiều hơn','Bằng nhau'], answer: 2,
      explain: '5 = 5 nên hai bên bằng nhau.' },
    { text: 'Sắp các số 6, 2, 9 từ bé đến lớn, ta được?', options: ['2, 6, 9','9, 6, 2','6, 2, 9','2, 9, 6'], answer: 0,
      explain: 'Từ bé đến lớn: 2 < 6 < 9.' },
    { text: 'Sắp các số 4, 10, 7 từ lớn đến bé, ta được?', options: ['4, 7, 10','10, 7, 4','7, 10, 4','10, 4, 7'], answer: 1,
      explain: 'Từ lớn đến bé: 10 > 7 > 4.' },
    { text: 'Số nào lớn hơn 8 trong phạm vi 10?', options: ['7','8','9','Không có số nào'], answer: 2,
      explain: '9 và 10 đều lớn hơn 8; trong các đáp án chỉ có 9.' }
  ];

  const QUIZ = PAIRS.map(p => fillSign(p[0], p[1])).concat(WORD);

  const EXPR = [
    ['9', 9, '4 + 1', 5], ['8', 8, '10 − 2', 8], ['7', 7, '2 + 6', 8],
    ['3 + 4', 7, '7', 7], ['7 + 2', 9, '8', 8], ['10 − 2', 8, '7', 7],
    ['5 + 5', 10, '10', 10], ['6 − 3', 3, '1 + 1', 2], ['2 + 3', 5, '9 − 4', 5],
    ['10 − 6', 4, '4 + 2', 6], ['1 + 8', 9, '10 − 1', 9], ['4 + 4', 8, '10 − 3', 7],
    ['6', 6, '3 + 3', 6], ['10', 10, '5 + 4', 9], ['0 + 7', 7, '9 − 3', 6],
    ['8 − 5', 3, '2 + 1', 3], ['5 + 2', 7, '10 − 4', 6], ['9 − 9', 0, '0', 0],
    ['3 + 3', 6, '2 + 5', 7], ['10 − 5', 5, '1 + 3', 4], ['4 + 5', 9, '10 − 2', 8],
    ['7 − 2', 5, '2 + 4', 6], ['6 + 4', 10, '10 − 0', 10], ['8 − 3', 5, '5', 5]
  ];

  function fillExpr(row) {
    const [la, lv, rb, rv] = row;
    const s = sgOf(lv, rv);
    return {
      text: la + '  …  ' + rb, options: SG, answer: SG.indexOf(s),
      explain: 'Tính hai bên trước: ' + la + ' = ' + lv + ' và ' + rb + ' = ' + rv + '. Vì ' + lv + ' ' + sgWord(s) + ' ' + rv + ' nên điền dấu ' + s + '.'
    };
  }

  const ADV_WORD = [
    { text: 'Điền số thích hợp: 3 + 2 < …', options: ['4','5','6'], answer: 2,
      explain: '3 + 2 = 5, cần số lớn hơn 5 nên chọn 6.' },
    { text: 'Điền số thích hợp: … < 10 − 4', options: ['5','6','7'], answer: 0,
      explain: '10 − 4 = 6, cần số bé hơn 6 nên chọn 5.' },
    { text: 'Số nào làm cho 7 = 4 + … đúng?', options: ['2','3','4'], answer: 1,
      explain: '4 + 3 = 7 nên số cần điền là 3.' },
    { text: 'Bạn An có 4 + 3 quả cam, bạn Bình có 9 − 1 quả cam. Ai nhiều hơn?', options: ['Bạn An','Bạn Bình','Bằng nhau'], answer: 1,
      explain: '4 + 3 = 7 và 9 − 1 = 8. Vì 8 > 7 nên bạn Bình nhiều hơn.' },
    { text: 'Trong các số 2 + 5, 10 − 4, 3 + 3 — kết quả nào lớn nhất?', options: ['2 + 5','10 − 4','3 + 3'], answer: 0,
      explain: '2 + 5 = 7, 10 − 4 = 6, 3 + 3 = 6. Lớn nhất là 7.' },
    { text: 'Sắp theo thứ tự từ bé đến lớn: 4 + 1, 8 − 5, 2 + 6', options: ['8 − 5, 4 + 1, 2 + 6','4 + 1, 8 − 5, 2 + 6','2 + 6, 4 + 1, 8 − 5'], answer: 0,
      explain: 'Tính ra: 5, 3, 8. Từ bé đến lớn là 3 < 5 < 8, tức 8 − 5, 4 + 1, 2 + 6.' }
  ];

  const QUIZ_ADV = EXPR.map(fillExpr).concat(ADV_WORD);
  const SIGNS = ['>', '<', '='];

  function rnd(max) { return Math.floor(Math.random() * (max + 1)); }
  function newRound() {
    let a = rnd(10), b = rnd(10);
    if (Math.random() < 0.2) b = a;
    return { a, b };
  }

  const HINTS = {
    signs: 'Ba dấu cần nhớ: lớn hơn, bé hơn, bằng',
    line: 'Bấm hai số trên tia số để so sánh',
    play: 'Đếm rồi chọn dấu đúng',
    quiz: 'Bài tập cơ bản và nâng cao'
  };

  const state = { tab: 'signs', picked: {}, pickedAdv: {}, level: 'basic', sel: [3, 8], round: { a: 4, b: 6 }, answer: null, right: 0, total: 0 };

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const dots = (n, color) => Array.from({ length: n }, () => '<span class="dot" style="background:' + color + '"></span>').join('');

  function renderTabs() {
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
    document.querySelectorAll('.section').forEach(s => s.classList.remove('on'));
    $('sec-' + state.tab).classList.add('on');
    $('tabhint').textContent = HINTS[state.tab];
  }
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
    state.tab = b.dataset.tab; renderTabs();
    if (state.tab === 'line') renderLine();
    if (state.tab === 'play') renderPlay();
  }));

  // ---- Ba dấu ----
  function renderSigns() {
    $('sec-signs').innerHTML = `
      <div class="signs-grid">
        <div class="card">
          <div class="card-head"><span class="card-sign">&gt;</span>
            <div><h3>Dấu lớn hơn</h3><span class="sub">7 &gt; 4 — đọc là "bảy lớn hơn bốn"</span></div>
          </div>
          <div class="compare"><div class="dots">${dots(7,'var(--foreground)')}</div><span class="mid">&gt;</span><div class="dots">${dots(4,'var(--border)')}</div></div>
          <p>Bên trái nhiều hơn nên số bên trái lớn hơn. Miệng dấu mở về phía số lớn.</p>
        </div>
        <div class="card">
          <div class="card-head"><span class="card-sign">&lt;</span>
            <div><h3>Dấu bé hơn</h3><span class="sub">3 &lt; 6 — đọc là "ba bé hơn sáu"</span></div>
          </div>
          <div class="compare"><div class="dots">${dots(3,'var(--border)')}</div><span class="mid">&lt;</span><div class="dots">${dots(6,'var(--foreground)')}</div></div>
          <p>Bên trái ít hơn nên số bên trái bé hơn. Đầu nhọn của dấu chỉ về số bé.</p>
        </div>
        <div class="card">
          <div class="card-head"><span class="card-sign">=</span>
            <div><h3>Dấu bằng</h3><span class="sub">5 = 5 — đọc là "năm bằng năm"</span></div>
          </div>
          <div class="compare"><div class="dots">${dots(5,'var(--foreground)')}</div><span class="mid">=</span><div class="dots">${dots(5,'var(--foreground)')}</div></div>
          <p>Hai bên có số vật như nhau, không bên nào nhiều hơn — ta dùng dấu bằng.</p>
        </div>
      </div>
      <div class="tip">
        <h3>Mẹo nhớ nhanh</h3>
        <p>Dấu &gt; và &lt; giống cái miệng đang há. Miệng luôn <strong>há về phía số lớn hơn</strong> và <strong>mũi nhọn chỉ vào số bé hơn</strong>. Khi hai số giống nhau thì viết dấu =.</p>
      </div>`;
  }

  // ---- Tia số ----
  function renderLine() {
    const [s1, s2] = state.sel;
    const ls = sgOf(s1, s2);
    const note = ls === '=' ? 'Hai số bằng nhau nên cùng nằm ở một vị trí trên tia số.'
      : (ls === '>' ? 'Số ' + s1 + ' đứng bên phải số ' + s2 + ' nên ' + s1 + ' lớn hơn ' + s2 + '.'
                     : 'Số ' + s1 + ' đứng bên trái số ' + s2 + ' nên ' + s1 + ' bé hơn ' + s2 + '.');
    const btns = Array.from({ length: 11 }, (_, n) =>
      '<button type="button" class="numbtn' + (state.sel.includes(n) ? ' on' : '') + '" data-n="' + n + '">' + n + '</button>').join('');
    $('sec-line').innerHTML = `
      <div class="panel pad">
        <div style="display:flex;flex-direction:column;gap:3px">
          <h2>Tia số từ 0 đến 10</h2><span class="muted">Bấm vào hai số để so sánh chúng</span>
        </div>
        <div class="numrow">${btns}</div>
        <div class="linebox"><span class="lineexpr">${esc(s1 + '  ' + ls + '  ' + s2)}</span><span class="linenote">${note}</span></div>
        <p>Trên tia số, số nào đứng <strong>bên phải thì lớn hơn</strong>, số nào đứng <strong>bên trái thì bé hơn</strong>. Số 0 là số bé nhất, số 10 là số lớn nhất trong phạm vi này.</p>
      </div>`;
    $('sec-line').querySelectorAll('.numbtn').forEach(b => b.addEventListener('click', () => {
      state.sel = [state.sel[1], +b.dataset.n];
      renderLine();
    }));
  }

  // ---- Luyện tập ----
  function renderPlay() {
    const { round, answer, right, total } = state;
    const correct = sgOf(round.a, round.b);
    const feedback = answer === null ? 'Đếm số chấm ở hai bên rồi chọn dấu.'
      : (answer === correct ? 'Chính xác! ' + round.a + ' ' + correct + ' ' + round.b + '.'
                            : 'Chưa đúng — đáp án là ' + round.a + ' ' + correct + ' ' + round.b + '.');
    const signBtns = SIGNS.map(sg => {
      let bd = 'var(--border)', bg = 'var(--card)', fg = 'var(--foreground)';
      if (answer) {
        if (sg === correct) { bd = accent; bg = 'var(--muted)'; fg = accent; }
        else if (sg === answer) { bd = 'var(--border)'; bg = 'var(--muted)'; fg = 'var(--muted-foreground)'; }
        else { fg = 'var(--muted-foreground)'; }
      }
      return '<button type="button" class="signbtn" data-sg="' + sg + '" style="border-color:' + bd + ';background:' + bg + ';color:' + fg + ';cursor:' + (answer ? 'default' : 'pointer') + '">' + sg + '</button>';
    }).join('');
    $('sec-play').innerHTML = `
      <div class="phead">
        <div style="display:flex;flex-direction:column;gap:2px">
          <h2>Điền dấu thích hợp</h2><span class="sub">Đếm hai bên rồi chọn dấu &gt;, &lt; hoặc =</span>
        </div>
        <span class="score">Đúng ${right}/${total}</span>
      </div>
      <div class="pbody">
        <div class="parena">
          <div class="pside"><div class="pdots">${Array.from({length:Math.min(round.a,maxDots)},()=>'<span class="pdot"></span>').join('')}</div><span class="pnum">${round.a}</span></div>
          <span class="psign">${answer ? correct : '?'}</span>
          <div class="pside"><div class="pdots">${Array.from({length:Math.min(round.b,maxDots)},()=>'<span class="pdot"></span>').join('')}</div><span class="pnum">${round.b}</span></div>
        </div>
        <div class="signgrid">${signBtns}</div>
        <div class="pfoot">
          <span class="pfeedback">${feedback}</span>
          <button type="button" class="btn btn-secondary" id="play-next">Câu tiếp theo</button>
        </div>
      </div>`;
    $('sec-play').querySelectorAll('.signbtn').forEach(b => b.addEventListener('click', () => {
      if (state.answer) return;
      const sg = b.dataset.sg;
      state.answer = sg; state.total += 1;
      if (sg === sgOf(state.round.a, state.round.b)) state.right += 1;
      renderPlay();
    }));
    $('play-next').addEventListener('click', () => { state.round = newRound(); state.answer = null; renderPlay(); });
  }

  // ---- Bài tập (có 2 mức: cơ bản / nâng cao) ----
  const bank = () => state.level === 'adv' ? QUIZ_ADV : QUIZ;
  const store = () => state.level === 'adv' ? state.pickedAdv : state.picked;

  function optStyle(qi, oi) {
    const b = bank(), p = store()[qi];
    const correct = b[qi].answer === oi;
    let bg = 'var(--card)', bd = 'var(--border)', fg = 'var(--foreground)', fw = '500', extra = '';
    if (p !== undefined) {
      if (correct) { bg = 'var(--muted)'; bd = accent; fg = accent; fw = '600'; }
      else if (p === oi) { bg = 'var(--muted)'; bd = 'var(--border)'; fg = 'var(--muted-foreground)'; extra = 'text-decoration:line-through;'; }
      else { fg = 'var(--muted-foreground)'; }
    }
    return 'border:1px solid ' + bd + ';background:' + bg + ';color:' + fg + ';font-weight:' + fw + ';cursor:' + (p === undefined ? 'pointer' : 'default') + ';' + extra;
  }
  function updateQuizHeader() {
    const b = bank(), s = store();
    const score = Object.keys(s).filter(k => s[k] === b[k].answer).length;
    const answered = Object.keys(s).length;
    $('quiz-score').textContent = 'Đúng ' + score + '/' + b.length;
    $('quiz-sub').textContent = state.level === 'adv'
      ? b.length + ' bài nâng cao — tính hai bên rồi so sánh'
      : b.length + ' bài — bấm vào đáp án em chọn';
    $('quiz-closing').textContent = answered === b.length
      ? (score === b.length ? 'Tuyệt vời, em trả lời đúng hết!' : 'Xem lại phần Ba dấu và Tia số rồi thử lại nhé.')
      : 'Đã làm ' + answered + '/' + b.length + ' bài. Làm hết để xem kết quả.';
  }
  function updateQuestion(qi) {
    const qEl = $('q-' + qi);
    qEl.querySelectorAll('.opt').forEach((btn, oi) => btn.setAttribute('style', optStyle(qi, oi)));
    qEl.querySelector('.qexplain').style.display = store()[qi] !== undefined ? 'block' : 'none';
  }
  function renderPractice() {
    const b = bank();
    const qs = b.map((q, qi) => `
      <div class="q" id="q-${qi}">
        <div class="qtext"><span class="qnum">${qi + 1}</span><span class="qlabel">${esc(q.text)}</span></div>
        <div class="qopts">${q.options.map((label, oi) =>
          '<button type="button" class="opt" data-qi="' + qi + '" data-oi="' + oi + '" style="' + optStyle(qi, oi) + '">' + esc(label) + '</button>').join('')}</div>
        <div class="qexplain" style="display:none">${esc(q.explain)}</div>
      </div>`).join('');
    $('sec-quiz').innerHTML = `
      <div class="phead">
        <div style="display:flex;flex-direction:column;gap:2px">
          <h2>Bài tập</h2><span class="sub" id="quiz-sub"></span>
        </div>
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <div class="levels">
            <button type="button" class="lvbtn${state.level==='basic'?' on':''}" data-lv="basic">Cơ bản</button>
            <button type="button" class="lvbtn${state.level==='adv'?' on':''}" data-lv="adv">Nâng cao</button>
          </div>
          <span class="score" id="quiz-score"></span>
          <button type="button" class="btn-ghost" id="quiz-reset">Làm lại</button>
        </div>
      </div>
      <div class="qbody">${qs}<p class="closing" id="quiz-closing"></p></div>`;
    $('sec-quiz').querySelectorAll('.lvbtn').forEach(btn => btn.addEventListener('click', () => {
      if (state.level === btn.dataset.lv) return;
      state.level = btn.dataset.lv; renderPractice();
    }));
    $('sec-quiz').querySelectorAll('.opt').forEach(btn => btn.addEventListener('click', () => {
      const qi = +btn.dataset.qi, oi = +btn.dataset.oi;
      if (store()[qi] !== undefined) return;
      store()[qi] = oi;
      updateQuestion(qi); updateQuizHeader();
    }));
    $('quiz-reset').addEventListener('click', () => {
      if (state.level === 'adv') state.pickedAdv = {}; else state.picked = {};
      renderPractice();
    });
    b.forEach((q, qi) => updateQuestion(qi));
    updateQuizHeader();
  }

  renderSigns();
  renderLine();
  renderPlay();
  renderPractice();
  renderTabs();
</script>
</body>
</html>
