<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đọc hiểu tiếng Anh — Level 1 — Toán Vui</title>
<link rel="icon" type="image/jpeg" href="logo-teacher-b.jpg">
<link rel="apple-touch-icon" href="logo-teacher-b.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --radius: 0.625rem;
    --background: oklch(1 0 0);
    --foreground: oklch(0.145 0 0);
    --card: oklch(1 0 0);
    --card-foreground: oklch(0.145 0 0);
    --primary: oklch(0.205 0 0);
    --primary-foreground: oklch(0.985 0 0);
    --secondary: oklch(0.97 0 0);
    --secondary-foreground: oklch(0.205 0 0);
    --muted: oklch(0.97 0 0);
    --muted-foreground: oklch(0.556 0 0);
    --accent: oklch(0.97 0 0);
    --accent-foreground: oklch(0.205 0 0);
    --border: oklch(0.922 0 0);
    --ring: oklch(0.708 0 0);
    --radius-md: calc(var(--radius) - 2px);
    --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
    --shadow-lg: 0 12px 32px rgb(0 0 0 / 0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: oklch(0.145 0 0);
      --foreground: oklch(0.985 0 0);
      --card: oklch(0.205 0 0);
      --card-foreground: oklch(0.985 0 0);
      --primary: oklch(0.985 0 0);
      --primary-foreground: oklch(0.205 0 0);
      --secondary: oklch(0.269 0 0);
      --secondary-foreground: oklch(0.985 0 0);
      --muted: oklch(0.269 0 0);
      --muted-foreground: oklch(0.708 0 0);
      --accent: oklch(0.269 0 0);
      --accent-foreground: oklch(0.985 0 0);
      --border: oklch(1 0 0 / 10%);
      --ring: oklch(0.556 0 0);
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--background); color: var(--foreground); font-family: Geist, 'Be Vietnam Pro', Inter, ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #app { min-height: 100vh; padding: 0 24px 96px; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1120px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-sm); }
</style>
</head>
<body>

<a href="index.html" id="tv-home" aria-label="Về trang chủ" style="position:fixed;top:14px;left:14px;z-index:2147483647;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--foreground);font:500 14px/1 Geist,'Be Vietnam Pro',system-ui,sans-serif;text-decoration:none;box-shadow:var(--shadow-sm)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Trang chủ</a>

<div id="app"></div>

<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

  const UNIT1 = [
    ["Món quà của tình yêu, tớ là ai?", "Riddle: I smell nice… What am I?", "en-u1-b1.html"],
    ["Vườn thú cưng", "Pet zoo", "en-u1-b2.html"],
    ["Bí quyết tìm đường của loài vật", "How animals find their way", "en-u1-b3.html"],
    ["Bạn có biết hát yodel?", "Can you yodel?", "en-u1-b4.html"],
    ["Trái cây nhiệt đới trồng ở Hàn Quốc", "Tropical fruit in Korea", null],
    ["Tấm gương giúp bạn xin nhận xét khi thử đồ", "A mirror that gives feedback", null]
  ];
  const doneCount = UNIT1.filter(l => l[2]).length;

  const unitCards = UNIT1.map(([vi, en, href], i) => {
    const ready = !!href;
    const wrap = 'display:flex;align-items:flex-start;gap:12px;padding:16px;border:1px solid ' + (ready ? 'var(--border)' : 'var(--border)') +
      ';border-radius:10px;background:' + (ready ? 'var(--card)' : 'var(--muted)') + ';color:' + (ready ? 'var(--foreground)' : 'var(--muted-foreground)') +
      ';cursor:' + (ready ? 'pointer' : 'default') + ';text-decoration:none;transition:background 150ms';
    const badge = ready ? 'Học ngay →' : 'Sắp có';
    const badgeStyle = 'margin-left:auto;flex:none;align-self:center;font-size:13px;font-weight:600;color:' + (ready ? 'var(--foreground)' : 'var(--muted-foreground)') + ';white-space:nowrap';
    return `<a href="${ready ? href : '#'}" style="${wrap}">
      <span style="flex:none;width:34px;height:34px;border-radius:8px;background:var(--muted);border:1px solid var(--border);display:grid;place-items:center;font-size:15px;font-weight:700;color:var(--foreground)">${i + 1}</span>
      <span style="display:flex;flex-direction:column;gap:4px">
        <span style="font-size:16px;font-weight:600;line-height:1.45">${esc(vi)}</span>
        <span style="font-size:13px;color:var(--muted-foreground)">${esc(en)}</span>
      </span>
      <span style="${badgeStyle}">${badge}</span>
    </a>`;
  }).join('');

  $('app').innerHTML = `
    <div class="wrap" style="padding:56px 0 32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px;align-items:center">
      <div style="display:flex;flex-direction:column;gap:14px">
        <span style="font-size:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground)">Bài đọc tiếng Anh · Level 1 · Lexile 510L</span>
        <h1 style="margin:0;font-size:44px;line-height:1.1;font-weight:700;letter-spacing:-0.02em">Luyện đọc hiểu tiếng Anh</h1>
        <p style="margin:0;max-width:560px;font-size:16px;line-height:1.65;color:var(--muted-foreground);text-wrap:pretty">Mỗi <strong style="font-weight:600;color:var(--foreground)">Unit</strong> có 6 bài đọc nhỏ. Mỗi bài đi theo cùng một nhịp: đọc — từ vựng — tìm manh mối — chọn đáp án — cấu trúc câu — bài tập.</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px">
          <span style="padding:6px 12px;border:1px solid var(--border);border-radius:999px;background:var(--card);font-size:13px;font-weight:600;color:var(--muted-foreground)">Đã dựng ${doneCount}/6 bài</span>
          <span style="padding:6px 12px;border:1px solid var(--border);border-radius:999px;background:var(--card);font-size:13px;font-weight:600;color:var(--muted-foreground)">Unit 1 · Động từ cảm giác + tính từ</span>
        </div>
      </div>
      <div style="justify-self:center;width:280px;aspect-ratio:3/4;border:1px solid var(--border);border-radius:16px;background:var(--primary);color:var(--primary-foreground);padding:26px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow-lg)">
        <div style="display:flex;flex-direction:column;gap:8px">
          <span style="font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.7">Level 1</span>
          <span style="font-size:30px;font-weight:700;line-height:1.15;letter-spacing:-0.02em">Reading<br>Practice</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <span style="font-size:14px;opacity:.85">6 bài · Unit 1</span>
          <span style="font-size:13px;opacity:.6">Đọc — hiểu — trả lời</span>
        </div>
      </div>
    </div>

    <div class="wrap" style="display:flex;flex-direction:column;gap:16px">
      <div class="card" style="padding:24px;display:flex;flex-direction:column;gap:20px">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap">
          <div style="display:flex;align-items:center;gap:16px">
            <span style="flex:none;width:52px;height:52px;border-radius:12px;background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;font-size:22px;font-weight:700">1</span>
            <div style="display:flex;flex-direction:column;gap:4px">
              <h2 style="margin:0;font-size:20px;font-weight:600;letter-spacing:-0.01em">Unit 1</h2>
              <span style="font-size:14px;color:var(--muted-foreground)">Key Structures: động từ cảm giác + tính từ · get / become + tính từ</span>
            </div>
          </div>
          <span style="padding:6px 12px;border:1px solid var(--border);border-radius:999px;font-size:13px;font-weight:600;color:var(--muted-foreground)">6 bài</span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px">${unitCards}</div>
      </div>

      <div style="background:var(--card);border:1px dashed var(--border);border-radius:12px;padding:22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap">
        <span style="flex:none;width:44px;height:44px;border-radius:10px;background:var(--muted);border:1px solid var(--border);display:grid;place-items:center;font-size:18px;font-weight:700;color:var(--muted-foreground)">2</span>
        <div style="display:flex;flex-direction:column;gap:3px">
          <span style="font-size:16px;font-weight:600;color:var(--muted-foreground)">Unit 2 và các unit sau</span>
          <span style="font-size:14px;color:var(--muted-foreground)">Gửi ảnh trang Unit tiếp theo, sẽ dựng thêm vào đây</span>
        </div>
      </div>
    </div>`;
</script>
</body>
</html>
