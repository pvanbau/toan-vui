<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bạn có biết hát yodel? — Unit 1 Bài 4 — Toán Vui</title>
<link rel="icon" type="image/jpeg" href="logo-teacher-b.jpg">
<link rel="apple-touch-icon" href="logo-teacher-b.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --radius: 0.625rem;
    --background: oklch(1 0 0); --foreground: oklch(0.145 0 0);
    --card: oklch(1 0 0); --card-foreground: oklch(0.145 0 0);
    --primary: oklch(0.205 0 0); --primary-foreground: oklch(0.985 0 0);
    --secondary: oklch(0.97 0 0); --secondary-foreground: oklch(0.205 0 0);
    --muted: oklch(0.97 0 0); --muted-foreground: oklch(0.556 0 0);
    --accent: oklch(0.97 0 0); --accent-foreground: oklch(0.205 0 0);
    --border: oklch(0.922 0 0); --ring: oklch(0.708 0 0);
    --success: #16A34A; --success-fg: #15803D; --success-br: #86EFAC; --success-bg: #F0FDF4;
    --destructive: #DC2626; --destructive-fg: #B91C1C; --destructive-br: #FCA5A5; --destructive-bg: #FEF2F2;
    --radius-md: calc(var(--radius) - 2px);
    --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: oklch(0.145 0 0); --foreground: oklch(0.985 0 0);
      --card: oklch(0.205 0 0); --card-foreground: oklch(0.985 0 0);
      --primary: oklch(0.985 0 0); --primary-foreground: oklch(0.205 0 0);
      --secondary: oklch(0.269 0 0); --secondary-foreground: oklch(0.985 0 0);
      --muted: oklch(0.269 0 0); --muted-foreground: oklch(0.708 0 0);
      --accent: oklch(0.269 0 0); --accent-foreground: oklch(0.985 0 0);
      --border: oklch(1 0 0 / 10%); --ring: oklch(0.556 0 0);
      --success: #4ADE80; --success-fg: #86EFAC; --success-br: #166534; --success-bg: rgba(34,197,94,.14);
      --destructive: #F87171; --destructive-fg: #FCA5A5; --destructive-br: #7F1D1D; --destructive-bg: rgba(248,113,113,.14);
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--background); color: var(--foreground); font-family: Geist, 'Be Vietnam Pro', Inter, ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #app { min-height: 100vh; padding: 0 24px 96px; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1200px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-sm); }
  .h2 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
  .sub { font-size: 14px; color: var(--muted-foreground); }
  .tabs { display: flex; gap: 4px; padding: 4px; background: var(--muted); border-radius: var(--radius); width: fit-content; flex-wrap: wrap; }
  .tab { padding: 8px 14px; border: none; border-radius: var(--radius-md); white-space: nowrap; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 150ms cubic-bezier(.4,0,.2,1); background: transparent; color: var(--muted-foreground); }
  .tab.on { background: var(--card); color: var(--foreground); font-weight: 600; box-shadow: var(--shadow-xs); }
</style>
</head>
<body>

<a href="tieng-anh.html" id="tv-home" aria-label="Về mục lục" style="position:fixed;top:14px;left:14px;z-index:2147483647;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--foreground);font:500 14px/1 Geist,'Be Vietnam Pro',system-ui,sans-serif;text-decoration:none;box-shadow:var(--shadow-sm)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Mục lục</a>

<div id="app"></div>

<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
  const RATE = 0.85, ACCENT = 'en-US', SHOW_VI = true;

  const GLOSS = {
    a: ["(art) một", ""], yodel: ["(n) điệu hát yodel", "điệu hát của người miền núi Thụy Sĩ"], yodels: ["(n) những điệu yodel", "số nhiều của yodel"],
    is: ["(v) là", ""], sweet: ["(adj) ngọt, ngọt ngào", "a sweet song = một bài hát ngọt ngào"], song: ["(n) bài hát", ""],
    it: ["(pron) nó", "thay cho a yodel"], comes: ["(v) đến, xuất phát", "come from = đến từ, xuất phát từ"], from: ["(prep) từ", "come from the Alps = xuất phát từ dãy Alps"],
    alps: ["(n) dãy Alps", "dãy núi ở châu Âu"], in: ["(prep) ở, trong", ""], switzerland: ["(n) Thụy Sĩ", ""],
    shepherds: ["(n) những người chăn cừu", "số nhiều của shepherd"], called: ["(v) đã gọi", "quá khứ của call"], their: ["(det) của họ", ""],
    sheep: ["(n) cừu", "số ít và số nhiều viết giống nhau"], with: ["(prep) bằng, với", "with this song = bằng bài hát này"], this: ["(det) này", ""],
    people: ["(n) mọi người", ""], also: ["(adv) cũng", ""], communicated: ["(v) đã liên lạc", "quá khứ của communicate"],
    others: ["(pron) những người khác", ""], places: ["(n) những nơi", "số nhiều của place"], far: ["(adv) xa", "far away = ở rất xa"], away: ["(adv) xa, cách xa", ""],
    the: ["(art) (mạo từ)", ""], changes: ["(v) thay đổi", "change between A and B = đổi giữa A và B"], between: ["(prep) giữa", "between high and low = giữa cao và thấp"],
    high: ["(adj) cao", ""], and: ["(conj) và", ""], low: ["(adj) thấp", ""],
    sounds: ["(n) âm thanh; (v) nghe có vẻ", "sau sound là TÍNH TỪ: sound beautiful"], sound: ["(v) nghe có vẻ", "sound beautiful = nghe thật hay"], beautiful: ["(adj) đẹp, hay", ""],
    so: ["(conj) nên, vì vậy", ""], they: ["(pron) chúng", ""], are: ["(v) là", ""], popular: ["(adj) phổ biến, nổi tiếng", "popular all over the world = nổi tiếng khắp thế giới"],
    all: ["(det) khắp, tất cả", "all over = khắp"], over: ["(prep) khắp", ""], world: ["(n) thế giới", ""]
  };
  const LINES = [
    ["A yodel is a sweet song.", "Yodel là một điệu hát ngọt ngào."],
    ["It comes from the Alps in Switzerland.", "Nó xuất phát từ dãy Alps ở Thụy Sĩ."],
    ["Shepherds called their sheep with this song.", "Người chăn cừu đã gọi đàn cừu bằng bài hát này."],
    ["People also communicated with others in places far away with this song.", "Mọi người cũng dùng bài hát này để liên lạc với những người ở nơi rất xa."],
    ["The song changes between high and low sounds.", "Bài hát đổi qua lại giữa âm cao và âm thấp."],
    ["Yodels sound beautiful, so they are popular all over the world.", "Điệu yodel nghe thật hay, nên chúng nổi tiếng khắp thế giới."]
  ];
  const VOCAB = [
    ["yodel", "(n)", "một điệu hát của người miền núi Thụy Sĩ"], ["sweet", "(adj)", "ngọt, ngọt ngào"], ["come from", "(v)", "đến từ, xuất phát từ"],
    ["the Alps", "(n)", "dãy Alps"], ["Switzerland", "(n)", "Thụy Sĩ"], ["shepherd", "(n)", "người chăn cừu"], ["sheep", "(n)", "cừu"],
    ["communicate", "(v)", "liên lạc, giao tiếp"], ["others", "(pron)", "những người khác"], ["far away", "", "ở xa"],
    ["between", "(prep)", "giữa"], ["sound", "(n)/(v)", "âm thanh; nghe có vẻ"], ["popular", "(adj)", "phổ biến, nổi tiếng"]
  ];
  const PURPOSES = [
    ["①", "bày tỏ tình cảm yêu mến với đàn cừu", false, "Bài đọc không nói gì về việc bày tỏ tình cảm."],
    ["②", "tập hợp đàn cừu", true, "Dòng 3: Shepherds called their sheep with this song."],
    ["③", "báo cho người khác biết có nguy hiểm", false, "Bài đọc chỉ nói “liên lạc”, không nói báo nguy hiểm."],
    ["④", "liên lạc với những người ở nơi xa", true, "Dòng 4: communicated with others in places far away."],
    ["⑤", "đuổi những loài vật gây nguy hiểm cho đàn cừu đi thật xa", false, "Không có trong bài — “far away” là nói về người ở xa, không phải đuổi thú."]
  ];
  const DRILLS = [
    ["Yodels sound ___ .", ["beautiful", "beautifully"], 0, "sound + tính từ: sound beautiful."],
    ["A yodel ___ from Switzerland.", ["comes", "come"], 0, "A yodel là số ít → comes."],
    ["The song changes ___ high and low sounds.", ["between", "among"], 0, "between dùng cho 2 thứ: high và low."],
    ["Yodels are popular all ___ the world.", ["over", "in"], 0, "all over the world = khắp thế giới."]
  ];
  const QUIZ = [
    ["Yodel xuất phát từ đâu?", ["dãy Alps ở Thụy Sĩ", "dãy Himalaya ở Nepal", "vùng núi Hàn Quốc"], 0, "It comes from the Alps in Switzerland."],
    ["“shepherd” nghĩa là gì?", ["người chăn cừu", "con cừu", "người leo núi"], 0, "shepherd (n) = người chăn cừu."],
    ["Bài hát yodel thay đổi thế nào?", ["giữa âm cao và âm thấp", "giữa nhanh và chậm", "giữa to và nhỏ"], 0, "changes between high and low sounds."],
    ["Câu nào viết đúng?", ["Yodels sound beautiful.", "Yodels sound beautifully."], 0, "sound + tính từ."],
    ["Vì sao yodel nổi tiếng khắp thế giới?", ["vì nghe thật hay", "vì rất dễ hát", "vì rất cổ xưa"], 0, "Yodels sound beautiful, so they are popular."]
  ];
  const norm = w => w.toLowerCase().replace(/[^a-z]/g, "");

  const HINTS = { read: 'Bấm vào từ để nghe và xem nghĩa', words: '13 từ trong khung Help', purpose: 'Chọn 2 ý — có bẫy', grammar: 'sound + tính từ', quiz: 'Kiểm tra lại cả bài' };
  const TABS = [
    { k: 'read', label: '1. Đọc bài' }, { k: 'words', label: '2. Từ vựng' },
    { k: 'purpose', label: '3. Mục đích của yodel (2 ý)' }, { k: 'grammar', label: '4. sound + tính từ' }, { k: 'quiz', label: 'Bài tập' }
  ];

  const state = { tab: 'read', word: 'sound', showGloss: true, sel: {}, checked: false, drill: {}, quiz: {} };

  function speak(text) { try { const s = window.speechSynthesis; if (!s) return; s.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = ACCENT; u.rate = RATE; s.speak(u); } catch (e) {} }

  function pillStyle(tone) {
    const border = tone === 'ok' ? 'var(--success)' : tone === 'no' ? 'var(--destructive)' : 'var(--border)';
    const bg = tone === 'ok' ? 'var(--success-bg)' : tone === 'no' ? 'var(--destructive-bg)' : 'var(--card)';
    const color = tone === 'ok' ? 'var(--success-fg)' : tone === 'no' ? 'var(--destructive-fg)' : 'var(--foreground)';
    return 'text-align:left;padding:10px 16px;border:1px solid ' + border + ';border-radius:var(--radius-md);background:' + bg + ';color:' + color + ';font-family:inherit;font-size:15px;font-weight:600;cursor:pointer';
  }

  function headerHTML() {
    return `<div class="wrap" style="padding:56px 0 28px;display:flex;flex-direction:column;gap:14px">
      <span style="font-size:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground)">Level 1 · Unit 1 · Bài 4 · Văn hóa</span>
      <h1 style="margin:0;font-size:42px;line-height:1.12;font-weight:700;letter-spacing:-0.02em">Bạn có biết hát yodel?</h1>
      <p style="margin:0;max-width:780px;font-size:16px;line-height:1.65;color:var(--muted-foreground);text-wrap:pretty">Một điệu hát từ <strong style="font-weight:600;color:var(--foreground)">dãy Alps ở Thụy Sĩ</strong> — người chăn cừu dùng nó để gọi đàn cừu và gọi người ở rất xa.</p>
    </div>`;
  }
  function tabbarHTML() {
    const btns = TABS.map(t => `<button type="button" class="tab${state.tab === t.k ? ' on' : ''}" data-tab="${t.k}">${t.label}</button>`).join('');
    return `<div class="wrap" style="margin-bottom:28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap"><div class="tabs">${btns}</div><span class="sub">${esc(HINTS[state.tab])}</span></div>`;
  }

  /* TAB 1: ĐỌC */
  function readHTML() {
    const lines = LINES.map(([en, vi], li) => {
      const words = en.split(' ').map(t => {
        const k = norm(t), known = !!GLOSS[k], on = known && state.word === k;
        const st = 'margin-right:6px;padding:2px 4px;border:none;border-radius:5px;font-family:inherit;font-size:19px;line-height:1.7;font-weight:' + (on ? '700' : '500') + ';background:' + (on ? 'var(--primary)' : 'transparent') + ';color:' + (on ? 'var(--primary-foreground)' : known ? 'var(--foreground)' : 'var(--muted-foreground)') + ';cursor:' + (known ? 'pointer' : 'default');
        return `<button type="button" data-word="${k}" data-say="${esc(t.replace(/[^A-Za-z' ]/g, ''))}" data-known="${known ? 1 : 0}" style="${st}">${esc(t)}</button>`;
      }).join('');
      const vi_ = SHOW_VI ? `<span style="padding-left:36px;font-size:14px;line-height:1.6;color:var(--muted-foreground)">${esc(vi)}</span>` : '';
      return `<div style="display:flex;flex-direction:column;gap:6px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--muted)"><div style="display:flex;align-items:flex-start;gap:10px"><button type="button" data-line="${li}" style="flex:none;width:26px;height:26px;margin-top:2px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--foreground);font-size:12px;cursor:pointer">▶</button><div style="display:flex;flex-wrap:wrap;gap:2px 0">${words}</div></div>${vi_}</div>`;
    }).join('');
    const g = GLOSS[state.word] || ['', ''];
    const pickedVi = g[0] ? '' : 'Bấm một từ đậm trong bài đọc';
    return `<div class="wrap" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start">
      <div class="card" style="padding:24px;display:flex;flex-direction:column;gap:18px">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><h2 class="h2">The reading</h2><button type="button" id="read-all" style="padding:8px 14px;border:1px solid var(--primary);border-radius:var(--radius-md);background:var(--primary);color:var(--primary-foreground);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer">▶ Nghe cả bài</button></div>
        <div style="display:flex;flex-direction:column;gap:12px">${lines}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="card" style="overflow:hidden"><div style="padding:12px 16px;background:var(--muted);border-bottom:1px solid var(--border);font-size:14px;font-weight:600">Từ em vừa bấm</div><div style="padding:22px 16px;display:flex;flex-direction:column;gap:10px;min-height:150px"><span style="font-size:30px;font-weight:700;letter-spacing:-0.01em">${esc(state.word)}</span><span style="font-size:15px;font-weight:600;color:var(--muted-foreground)">${esc(g[0])}</span><span style="font-size:16px;line-height:1.6;color:var(--foreground)">${esc(pickedVi)}</span><span style="font-size:14px;line-height:1.6;color:var(--muted-foreground)">${esc(g[1])}</span></div></div>
        <div class="card" style="padding:20px;display:flex;flex-direction:column;gap:10px"><h3 style="margin:0;font-size:15px;font-weight:600">Vì sao yodel lên cao xuống thấp?</h3><span style="font-size:14px;line-height:1.7;color:var(--muted-foreground)">Ở vùng núi, âm thanh <strong style="font-weight:600;color:var(--foreground)">đổi giữa cao và thấp</strong> (high and low) vang xa hơn — nên người ở thung lũng bên kia vẫn nghe được. Đó là lý do người chăn cừu dùng nó để <strong style="font-weight:600;color:var(--foreground)">gọi cừu</strong> và <strong style="font-weight:600;color:var(--foreground)">liên lạc với người ở xa</strong>.</span></div>
      </div>
    </div>`;
  }
  function bindRead() {
    document.querySelectorAll('[data-word]').forEach(b => b.onclick = () => { if (b.dataset.known === '1') state.word = b.dataset.word; speak(b.dataset.say); if (b.dataset.known === '1') { $('tab-content').innerHTML = readHTML(); bindRead(); } });
    document.querySelectorAll('[data-line]').forEach(b => b.onclick = () => speak(LINES[+b.dataset.line][0]));
    $('read-all').onclick = () => speak(LINES.map(l => l[0]).join(' '));
  }

  /* TAB 2: TỪ VỰNG */
  function wordsHTML() {
    const vocab = VOCAB.map(([en, pos, vi], i) => {
      const viStyle = 'font-size:15px;line-height:1.5;color:' + (state.showGloss ? 'var(--foreground)' : 'var(--muted-foreground)');
      return `<button type="button" data-vocab="${i}" style="text-align:left;padding:16px;border:1px solid var(--border);border-radius:10px;background:var(--card);font-family:inherit;cursor:pointer;display:flex;flex-direction:column;gap:6px"><span style="font-size:18px;font-weight:700;color:var(--foreground)">${esc(en)}</span><span style="font-size:13px;font-weight:600;color:var(--muted-foreground)">${esc(pos)}</span><span style="${viStyle}">${esc(state.showGloss ? vi : '• • •')}</span></button>`;
    }).join('');
    return `<div class="wrap" style="display:flex;flex-direction:column;gap:16px"><div class="card" style="padding:24px;display:flex;flex-direction:column;gap:18px"><div style="display:flex;flex-direction:column;gap:4px"><h2 class="h2">Help — 13 từ cần nhớ</h2><span class="sub">Bấm thẻ để nghe từ. Bấm "Ẩn nghĩa" để tự kiểm tra.</span></div><button type="button" id="toggle-gloss" style="align-self:flex-start;padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--card);color:var(--foreground);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer">${state.showGloss ? 'Ẩn nghĩa để tự kiểm tra' : 'Hiện nghĩa tiếng Việt'}</button><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px">${vocab}</div></div></div>`;
  }
  function bindWords() {
    document.querySelectorAll('[data-vocab]').forEach(b => b.onclick = () => speak(VOCAB[+b.dataset.vocab][0]));
    $('toggle-gloss').onclick = () => { state.showGloss = !state.showGloss; $('tab-content').innerHTML = wordsHTML(); bindWords(); };
  }

  /* TAB 3: MỤC ĐÍCH (chọn 2) */
  function purposeHTML() {
    const opts = PURPOSES.map(([num, vi, correct, why], i) => {
      const on = !!state.sel[i];
      const tone = state.checked ? (on ? (correct ? 'ok' : 'no') : (correct ? 'no' : null)) : null;
      const border = tone === 'ok' ? 'var(--success)' : tone === 'no' ? 'var(--destructive)' : on ? 'var(--foreground)' : 'var(--border)';
      const bg = tone === 'ok' ? 'var(--success-bg)' : tone === 'no' ? 'var(--destructive-bg)' : on ? 'var(--muted)' : 'var(--card)';
      let mark = ' ';
      if (state.checked) mark = correct ? (on ? '✓ Đúng — ' + why : '→ Thiếu ý này. ' + why) : (on ? '✕ ' + why : ' ');
      const markStyle = 'margin-left:auto;flex:none;max-width:340px;font-size:13px;font-weight:600;line-height:1.5;color:' + (mark === ' ' ? 'transparent' : correct ? 'var(--success-fg)' : 'var(--destructive-fg)');
      const st = 'text-align:left;display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:1px solid ' + border + ';border-radius:10px;background:' + bg + ';font-family:inherit;cursor:pointer;box-shadow:' + (on && !state.checked ? '0 0 0 3px color-mix(in oklch, var(--foreground) 12%, transparent)' : 'none');
      return `<button type="button" data-purpose="${i}" style="${st}"><span style="flex:none;font-size:16px;font-weight:700;color:var(--muted-foreground)">${num}</span><span style="font-size:16px;font-weight:600;line-height:1.55">${esc(vi)}</span><span style="${markStyle}">${esc(mark)}</span></button>`;
    }).join('');
    const picked = Object.keys(state.sel).filter(k => state.sel[k]).map(Number);
    const rightSet = PURPOSES.map((p, i) => (p[2] ? i : -1)).filter(i => i >= 0);
    const allRight = picked.length === 2 && rightSet.every(i => picked.includes(i));
    const v = !state.checked ? { t: 'Đã chọn ' + picked.length + '/2', b: 'Chọn 2 ý rồi bấm Kiểm tra.', ok: null }
      : allRight ? { t: 'Đúng cả hai ý!', b: '② tập hợp đàn cừu (called their sheep) và ④ liên lạc với người ở nơi xa (communicated with others in places far away).', ok: true }
      : { t: 'Chưa đúng', b: 'Chỉ chọn ý có trong bài đọc. Mẹo: tìm 2 việc mà bài nói người ta LÀM với bài hát này.', ok: false };
    const vBorder = v.ok === true ? 'var(--success-br)' : v.ok === false ? 'var(--destructive-br)' : 'var(--border)';
    const vBg = v.ok === true ? 'var(--success-bg)' : v.ok === false ? 'var(--destructive-bg)' : 'var(--muted)';
    const vColor = v.ok === true ? 'var(--success-fg)' : v.ok === false ? 'var(--destructive-fg)' : 'var(--muted-foreground)';
    return `<div class="wrap" style="display:flex;flex-direction:column;gap:16px"><div class="card" style="padding:24px;display:flex;flex-direction:column;gap:20px">
      <div style="display:flex;flex-direction:column;gap:4px"><h2 class="h2">Theo bài đọc, mục đích của bài hát yodel là gì? (chọn 2 ý)</h2><span class="sub">Chỉ chọn ý mà bài đọc có nói — đừng chọn theo suy đoán</span></div>
      <div style="display:flex;flex-direction:column;gap:10px">${opts}</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" id="check-purpose" style="padding:10px 18px;border:1px solid var(--primary);border-radius:var(--radius-md);background:var(--primary);color:var(--primary-foreground);font-family:inherit;font-size:15px;font-weight:600;cursor:pointer">Kiểm tra</button><button type="button" id="reset-purpose" style="padding:10px 18px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--card);color:var(--foreground);font-family:inherit;font-size:15px;font-weight:600;cursor:pointer">Chọn lại</button></div>
      <div style="padding:16px;border-radius:10px;display:flex;flex-direction:column;gap:6px;border:1px solid ${vBorder};background:${vBg};color:${vColor}"><span style="font-size:15px;font-weight:600">${esc(v.t)}</span><span style="font-size:15px;line-height:1.7">${esc(v.b)}</span></div>
    </div></div>`;
  }
  function bindPurpose() {
    document.querySelectorAll('[data-purpose]').forEach(b => b.onclick = () => { const i = b.dataset.purpose; state.sel = { ...state.sel, [i]: !state.sel[i] }; state.checked = false; $('tab-content').innerHTML = purposeHTML(); bindPurpose(); });
    $('check-purpose').onclick = () => { state.checked = true; $('tab-content').innerHTML = purposeHTML(); bindPurpose(); };
    $('reset-purpose').onclick = () => { state.sel = {}; state.checked = false; $('tab-content').innerHTML = purposeHTML(); bindPurpose(); };
  }

  /* TAB 4: NGỮ PHÁP */
  function grammarHTML() {
    const drills = DRILLS.map(([q, opts, ans, note], i) => {
      const chosen = state.drill[i], done = chosen !== undefined, right = chosen === ans;
      const btns = opts.map((label, j) => `<button type="button" data-drill="${i}" data-j="${j}" data-say="${esc(q.replace('___', label))}" style="${pillStyle(done && chosen === j ? (right ? 'ok' : 'no') : null)}">${esc(label)}</button>`).join('');
      const feed = done ? (right ? '✓ ' + note : '✕ ' + note) : ' ';
      const feedStyle = 'font-size:14px;line-height:1.6;min-height:20px;color:' + (done ? (right ? 'var(--success-fg)' : 'var(--destructive-fg)') : 'transparent');
      return `<div style="display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--border);border-radius:10px;background:var(--muted)"><span style="font-size:16px;font-weight:600">${esc(q)}</span><div style="display:flex;gap:8px;flex-wrap:wrap">${btns}</div><span style="${feedStyle}">${esc(feed)}</span></div>`;
    }).join('');
    return `<div class="wrap" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start">
      <div class="card" style="padding:24px;display:flex;flex-direction:column;gap:16px">
        <h2 class="h2">Dòng 5: <em style="font-style:normal;color:var(--foreground)">Yodels sound beautiful.</em></h2>
        <span style="font-size:15px;line-height:1.7;color:var(--muted-foreground)">Nghĩa: <strong style="font-weight:600;color:var(--foreground)">Điệu yodel nghe thật hay.</strong> Sau động từ <strong style="font-weight:600;color:var(--foreground)">sound</strong> là <strong style="font-weight:600;color:var(--foreground)">tính từ</strong> (beautiful) — giống smell, feel, look, taste em đã học ở bài 1 và 2.</span>
        <div style="display:flex;flex-direction:column;gap:10px">
          <div style="display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--success-br);border-radius:10px;background:var(--success-bg)"><span style="font-size:16px;font-weight:700;color:var(--success-fg)">✓</span><span style="font-size:16px;font-weight:600">Yodels sound beautiful.</span></div>
          <div style="display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--destructive-br);border-radius:10px;background:var(--destructive-bg)"><span style="font-size:16px;font-weight:700;color:var(--destructive-fg)">✕</span><span style="font-size:16px;font-weight:600;text-decoration:line-through">Yodels sound beautifully.</span></div>
        </div>
        <div style="padding:14px;border:1px solid var(--border);border-radius:10px;background:var(--muted);display:flex;flex-direction:column;gap:6px"><span style="font-size:14px;font-weight:600">5 động từ cảm giác đã học</span><span style="font-size:14px;line-height:1.8;color:var(--muted-foreground)"><strong style="font-weight:600;color:var(--foreground)">smell</strong> nice · <strong style="font-weight:600;color:var(--foreground)">feel</strong> soft · <strong style="font-weight:600;color:var(--foreground)">look</strong> beautiful · <strong style="font-weight:600;color:var(--foreground)">taste</strong> good · <strong style="font-weight:600;color:var(--foreground)">sound</strong> beautiful</span></div>
      </div>
      <div class="card" style="padding:24px;display:flex;flex-direction:column;gap:14px"><h3 style="margin:0;font-size:16px;font-weight:600">Luyện nhanh: chọn từ đúng</h3>${drills}</div>
    </div>`;
  }
  function bindGrammar() {
    document.querySelectorAll('[data-drill]').forEach(b => b.onclick = () => { state.drill = { ...state.drill, [b.dataset.drill]: +b.dataset.j }; speak(b.dataset.say); $('tab-content').innerHTML = grammarHTML(); bindGrammar(); });
  }

  /* TAB 5: BÀI TẬP */
  function quizHTML() {
    const answered = Object.keys(state.quiz).length, correct = Object.keys(state.quiz).filter(k => state.quiz[k] === QUIZ[k][2]).length;
    const score = answered === 0 ? 'Chưa làm câu nào' : 'Đã làm ' + answered + '/5 · đúng ' + correct;
    const items = QUIZ.map(([q, opts, ans, note], i) => {
      const chosen = state.quiz[i], done = chosen !== undefined, right = chosen === ans;
      const btns = opts.map((label, j) => `<button type="button" data-quiz="${i}" data-j="${j}" style="${pillStyle(done && chosen === j ? (right ? 'ok' : 'no') : null)}">${esc(label)}</button>`).join('');
      const feed = done ? (right ? '✓ Đúng. ' + note : '✕ Chưa đúng. ' + note) : ' ';
      const feedStyle = 'font-size:14px;line-height:1.6;min-height:20px;color:' + (done ? (right ? 'var(--success-fg)' : 'var(--destructive-fg)') : 'transparent');
      return `<div style="display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--border);border-radius:10px"><span style="font-size:16px;font-weight:600;line-height:1.55">${esc(q)}</span><div style="display:flex;gap:8px;flex-wrap:wrap">${btns}</div><span style="${feedStyle}">${esc(feed)}</span></div>`;
    }).join('');
    return `<div class="wrap" style="display:flex;flex-direction:column;gap:16px"><div class="card" style="padding:24px;display:flex;flex-direction:column;gap:20px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap"><div style="display:flex;flex-direction:column;gap:4px"><h2 class="h2">Bài tập — 5 câu</h2><span class="sub">${esc(score)}</span></div><button type="button" id="quiz-reset" style="padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--card);color:var(--foreground);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer">Làm lại</button></div>
      <div style="display:flex;flex-direction:column;gap:12px">${items}</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap"><a href="en-u1-b3.html" style="padding:12px 18px;border:1px solid var(--border);border-radius:10px;background:var(--card);font-size:15px;font-weight:600;color:var(--foreground)">← Bài 3</a><a href="tieng-anh.html" style="padding:12px 18px;border:1px solid var(--border);border-radius:10px;background:var(--card);font-size:15px;font-weight:600;color:var(--foreground)">Mục lục</a></div>
    </div></div>`;
  }
  function bindQuiz() {
    document.querySelectorAll('[data-quiz]').forEach(b => b.onclick = () => { state.quiz = { ...state.quiz, [b.dataset.quiz]: +b.dataset.j }; $('tab-content').innerHTML = quizHTML(); bindQuiz(); });
    $('quiz-reset').onclick = () => { state.quiz = {}; $('tab-content').innerHTML = quizHTML(); bindQuiz(); };
  }

  function setTab(t) { state.tab = t; render(); }
  function render() {
    $('app').innerHTML = headerHTML() + tabbarHTML() + '<div id="tab-content"></div>';
    document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => setTab(b.dataset.tab));
    const c = $('tab-content');
    if (state.tab === 'read') { c.innerHTML = readHTML(); bindRead(); }
    else if (state.tab === 'words') { c.innerHTML = wordsHTML(); bindWords(); }
    else if (state.tab === 'purpose') { c.innerHTML = purposeHTML(); bindPurpose(); }
    else if (state.tab === 'grammar') { c.innerHTML = grammarHTML(); bindGrammar(); }
    else { c.innerHTML = quizHTML(); bindQuiz(); }
  }
  render();
</script>
</body>
</html>
